<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kampüs Etkinlikleri - Tüm Etkinlikler</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/event-list.js"></script>
</head>
<body class="sayfa-etkinlikler">
  <div class="kapsayici-kart">
    <header>
      <h1>Tüm Etkinlikler</h1>
      <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="etkinlikler.html" class="aktif">Etkinlikler</a>
        <a href="etkinlik-ekle.html">Ekle</a>
      </nav>
    </header>

    <main>
      <!-- Arama ve Kategori Filtresi -->
      <form id="filtre-formu" class="filtre-kutusu">
        <div class="filtre-grup">
          <label for="arama">Etkinlik ara</label>
          <input type="search" id="arama" placeholder="Örn: atölye, kariyer...">
        </div>
        <div class="filtre-grup">
          <label for="kategori-filtre">Kategori</label>
          <select id="kategori-filtre">
            <option value="">Tümü</option>
          </select>
        </div>
      </form>

      <p id="sonuc" class="sonuc-bilgisi"></p>

      <!-- 6 Kartın dinamik basılacağı container -->
      <section id="etkinlik-listesi" class="etkinlikler-izgara"></section>
    </main>
  </div>
</body>
</html>
